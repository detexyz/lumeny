<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Симулятор стримера</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e141b;--card:#17202b;--line:#263444;--ink:#eaf2fa;--dim:#8ea0b4;--acc:#5db7f5;--mint:#4de8b0;--red:#ff5d73;--gold:#ffd24d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding-top:env(safe-area-inset-top);display:flex;flex-direction:column;max-width:480px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
#nm{color:var(--dim);font-size:14px}.mny{font-size:22px;font-weight:800;color:var(--mint);font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;padding:0 16px 120px}
section{display:none}section.on{display:block}
#scene svg{width:100%;display:block;border-radius:16px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--dim)}.chip b{color:var(--ink)}
.big{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#06141f;font:inherit;font-weight:800;font-size:17px}
.hint{color:var(--dim);font-size:13px;text-align:center;margin:10px 0}
.sub{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
.sub button{flex:none;padding:8px 12px;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:10px;font:inherit;font-size:14px}.sub button.on{color:var(--ink);border-color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:12px;margin-bottom:6px}
.row>span{flex:1}.row small{display:block;color:var(--dim);font-size:12px}
.mini{padding:7px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-size:14px;white-space:nowrap}
.mini.buy{background:var(--mint);color:#06281d;border:0;font-weight:700}.mini:disabled{opacity:.35}
h3{margin:16px 0 8px;font-size:14px;color:var(--dim);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card div{display:flex;justify-content:space-between;padding:4px 0}.card span{color:var(--dim)}
/* нижняя панель «жидкое стекло» */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(92vw,440px);z-index:20;display:flex;padding:6px;border-radius:28px;
  background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),inset 0 -1px 1px rgba(255,255,255,.08),0 12px 32px rgba(0,0,0,.4)}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:22px;background:rgba(255,255,255,.15);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 2px 10px rgba(0,0,0,.25);transition:transform .38s cubic-bezier(.3,1.25,.5,1)}
nav button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border:0;background:transparent;color:var(--dim);font:inherit;font-size:11px;font-weight:600;border-radius:22px}
nav button.on{color:var(--ink)}nav button.on svg{color:var(--acc)}
/* компьютер */
#pc{position:fixed;inset:0;z-index:70;background:#0a1017;display:none;flex-direction:column;max-width:480px;margin:0 auto}#pc.on{display:flex}
.pbar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:var(--dim);font-size:14px}
.pbar button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:14px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;padding:14px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font:inherit;font-size:12px;text-align:center}
.app i{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:22px;color:#fff}
.win{position:absolute;left:8px;right:8px;top:calc(54px + env(safe-area-inset-top));bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.win[hidden]{display:none}
.wt{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.wt button{background:none;border:0;color:var(--dim);font-size:18px}
#wb{position:relative;flex:1;overflow-y:auto;padding:12px}
.screen{position:relative;height:170px;border-radius:12px;background:#0d1520;overflow:hidden;border:1px solid var(--line)}
.screen .gname{position:absolute;left:10px;top:8px;font-weight:800;color:var(--dim)}
.screen .fps{position:absolute;right:10px;top:8px;font-size:12px;color:var(--mint)}.screen .fps.bad{color:var(--red)}
.screen .blk{position:absolute;left:0;height:14px;border-radius:7px;background:var(--line);animation:mv 3s linear infinite}
@keyframes mv{from{transform:translateX(-140px)}to{transform:translateX(440px)}}
.cam{position:absolute;right:8px;bottom:8px;width:84px;height:84px;border-radius:12px;background:#1a2632;border:2px solid var(--acc);overflow:hidden}
.live{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-right:6px}
#chat{margin-top:6px;max-height:140px;overflow-y:auto;font-size:14px}#chat div{padding:3px 0}#chat b{color:var(--gold)}
.alert{position:absolute;left:12px;right:12px;top:8px;background:rgba(77,232,176,.96);color:#06281d;border-radius:12px;padding:10px;font-weight:700;z-index:5;animation:pop .4s}
@keyframes pop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:90;background:var(--card);border:1px solid var(--acc);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90%;text-align:center}
.up{color:var(--mint)}.down{color:var(--red)}
</style>
</head>
<body>
<header><div id="nm">Стример</div><div class="mny" id="mny">0 ₽</div></header>
<main>
  <section id="room" class="on">
    <div id="scene"><div class="hint">Подключение…</div></div>
    <div class="chips" id="chips"></div>
    <button class="big" id="sit">Сесть за ПК</button>
    <p class="hint">Собери ПК и обставь комнату в магазине, потом включай стрим: чем круче комната и популярнее игра, тем больше донатов.</p>
  </section>
  <section id="shop"><div class="sub" id="shopsub"></div><div id="shoplist"></div></section>
  <section id="prof"><div class="card" id="stats"></div><div id="adm"></div></section>
</main>
<nav><i class="ind"></i>
  <button class="on" data-t="room"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Комната</button>
  <button data-t="shop"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Магазин</button>
  <button data-t="prof"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Профиль</button>
</nav>
<div id="pc">
  <div class="pbar"><span>Рабочий стол</span><button id="pcx">Выйти из-за ПК</button></div>
  <div class="apps" id="apps"></div>
  <div class="win" id="win" hidden><div class="wt"><span id="wtt"></span><button id="wx">✕</button></div><div id="wb"></div></div>
</div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0e141b');tg.setBackgroundColor('#0e141b')}catch(e){}}
const $=id=>document.getElementById(id);
const user=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Math.round(n).toLocaleString('ru-RU'),fmt=n=>num(n)+' ₽';
const buzz=t=>{try{tg&&tg.HapticFeedback.notificationOccurred(t)}catch(e){}};
$('nm').textContent=user.first_name||'Стример';
const SLN={cpu:'Процессор',gpu:'Видеокарта',ram:'Оперативная память',cam:'Вебкамера',mic:'Микрофон'};
const SLC={hat:'Головной убор',ears:'Наушники',glasses:'Очки',top:'Верх'};
let CAT=null,ME=null,ADMIN=false,PT={},FU={},CL={},GM={},ON={},PREV={},ws=null,shopTab='parts',cur=null;
const S={on:false,g:null,earned:0,viewers:0,chat:[],timer:0};

/* ---------- рисунки ---------- */
const ART={
 desk:'<rect x="108" y="172" width="212" height="12" rx="3" fill="#7a5a3f"/><rect x="116" y="184" width="8" height="30" fill="#5b4330"/><rect x="304" y="184" width="8" height="30" fill="#5b4330"/>',
 box:'<rect x="124" y="172" width="150" height="40" rx="3" fill="#8a6a45"/><path d="M124 190h150" stroke="#6f5436"/>',
 chair:'<rect x="226" y="118" width="48" height="52" rx="10" fill="#2b3644"/><rect x="218" y="170" width="64" height="9" rx="4" fill="#2b3644"/><rect x="246" y="179" width="8" height="32" fill="#202a35"/><rect x="232" y="211" width="36" height="6" rx="3" fill="#202a35"/>',
 stool:'<rect x="232" y="176" width="36" height="8" rx="4" fill="#59616b"/><rect x="246" y="184" width="8" height="28" fill="#59616b"/>',
 lamp:'<rect x="114" y="150" width="4" height="22" fill="#aab"/><path d="M106 150h20l-4-14h-12z" fill="#ffd24d"/><circle cx="116" cy="146" r="16" fill="#ffd24d" opacity=".14"/>',
 poster:'<rect x="150" y="38" width="42" height="56" rx="3" fill="#2f7fd6"/><circle cx="171" cy="62" r="10" fill="#e9edf2"/><rect x="158" y="80" width="26" height="4" fill="#ffd24d"/>',
 plant:'<rect x="22" y="196" width="22" height="20" rx="3" fill="#8a5a3c"/><path d="M33 196c-14-20-8-34-2-40 2 14 8 22 2 40zM33 196c14-16 18-28 12-36-6 12-12 20-12 36z" fill="#3fa66a"/>',
 rug:'<ellipse cx="190" cy="244" rx="100" ry="16" fill="#3a6ea5" opacity=".85"/><ellipse cx="190" cy="244" rx="72" ry="10" fill="none" stroke="#9ad1ff" stroke-width="2"/>',
 rgb:'<rect x="108" y="184" width="212" height="3" rx="1.5" fill="#4de8b0"><animate attributeName="fill" values="#4de8b0;#5db7f5;#ff6b8a;#ffd24d;#4de8b0" dur="4s" repeatCount="indefinite"/></rect>',
 shelf:'<rect x="236" y="58" width="90" height="6" fill="#7a5a3f"/><rect x="244" y="40" width="12" height="18" fill="#e05a5a"/><rect x="260" y="46" width="10" height="12" fill="#5db7f5"/><rect x="290" y="34" width="22" height="24" rx="4" fill="#ffd24d"/>',
 sofa:'<rect x="8" y="206" width="84" height="34" rx="10" fill="#3b4f6b"/><rect x="14" y="190" width="72" height="26" rx="10" fill="#46607f"/>',
 neon:'<text x="204" y="30" font-size="20" font-weight="800" fill="#ff6b8a" style="filter:drop-shadow(0 0 6px #ff6b8a)">GG</text>',
 curtains:'<rect x="22" y="26" width="14" height="84" fill="#5a3d5a"/><rect x="108" y="26" width="14" height="84" fill="#5a3d5a"/>'
};
const TOPC={tee:'#e9edf2',hood:'#3a5a8c',jersey:'#d9a23b',jacket:'#2d3239'};
/* скины админа: чтобы добавить свой, допишите сюда id (как в server.py), цвета и ex: crown | visor | beard | mask */
const SK={s_legend:{hair:'#f5c542',top:'#c0392b',ex:'crown'},s_tilt:{hair:'#222',top:'#16202b',ex:'visor'},s_gold:{hair:'#caa15a',top:'#d4af37',ex:'beard'},s_ghost:{hair:'#cfd8e3',top:'#3a4b5c',ex:'mask'}};
function char(me){
  const w=me.wear||{},sk=SK[me.skin]||{},top=sk.top||TOPC[w.top]||'#6b7a8c',hair=sk.hair||'#3b2a20';
  let x=`<g transform="translate(250 0)"><rect x="-21" y="138" width="42" height="54" rx="12" fill="${top}"/><rect x="-36" y="146" width="18" height="10" rx="5" fill="${top}"/><rect x="18" y="146" width="18" height="10" rx="5" fill="${top}"/><circle cy="118" r="17" fill="#e8b894"/><path d="M-18 116a18 18 0 0 1 36 0q-18-9-36 0z" fill="${hair}"/><circle cx="-6" cy="120" r="2" fill="#222"/><circle cx="6" cy="120" r="2" fill="#222"/><path d="M-5 127q5 4 10 0" stroke="#222" fill="none" stroke-width="1.6"/>`;
  if(w.hat==='cap')x+='<path d="M-19 112a19 19 0 0 1 38 0z" fill="#e05a5a"/><rect x="-4" y="108" width="28" height="5" rx="2" fill="#c04545"/>';
  if(w.hat==='beanie')x+='<path d="M-19 113a19 19 0 0 1 38 0z" fill="#5db7f5"/><rect x="-19" y="110" width="38" height="5" fill="#2f7fd6"/>';
  if(w.ears)x+='<path d="M-19 118a19 19 0 0 1 38 0" stroke="#111" stroke-width="4" fill="none"/><rect x="-24" y="115" width="8" height="15" rx="3" fill="#111"/><rect x="16" y="115" width="8" height="15" rx="3" fill="#111"/>';
  if(w.glasses==='gl1')x+='<circle cx="-6" cy="120" r="6" fill="none" stroke="#111" stroke-width="1.6"/><circle cx="6" cy="120" r="6" fill="none" stroke="#111" stroke-width="1.6"/>';
  if(w.glasses==='gl2')x+='<rect x="-13" y="116" width="26" height="8" rx="3" fill="#111"/>';
  if(sk.ex==='crown')x+='<path d="M-14 102l3-12 6 8 5-11 5 11 6-8 3 12z" fill="#ffd24d"/>';
  if(sk.ex==='visor')x+='<rect x="-16" y="115" width="32" height="9" rx="3" fill="#4de8b0" opacity=".9"/>';
  if(sk.ex==='beard')x+='<path d="M-14 124q14 26 28 0q-14 6-28 0z" fill="#6b4a2f"/>';
  if(sk.ex==='mask')x+='<rect x="-14" y="123" width="28" height="12" rx="4" fill="#e9edf2"/>';
  return x+'</g>';
}
function scene(me){
  const on=!me.miss.length,has=k=>me.furn.includes(k);
  return `<svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="260" fill="#1a2632"/><rect y="214" width="360" height="46" fill="#243342"/>
  <rect x="32" y="30" width="80" height="76" rx="4" fill="#0d1d2e" stroke="#3a4b5c" stroke-width="4"/><circle cx="90" cy="52" r="9" fill="#e9edf2"/><path d="M72 106V30M32 68h80" stroke="#3a4b5c" stroke-width="3"/>
  ${['curtains','poster','neon','shelf','sofa','rug','plant'].map(k=>has(k)?ART[k]:'').join('')}
  ${has('desk')?ART.desk:ART.box}${has('rgb')?ART.rgb:''}
  <rect x="132" y="104" width="92" height="60" rx="4" fill="#0b1118" stroke="#3a4b5c" stroke-width="3"/><rect x="137" y="109" width="82" height="50" fill="${on?'#14324a':'#0e151d'}">${on?'<animate attributeName="fill" values="#14324a;#1b4566;#14324a" dur="3s" repeatCount="indefinite"/>':''}</rect>
  <rect x="172" y="164" width="12" height="8" fill="#3a4b5c"/><rect x="146" y="167" width="64" height="5" rx="2" fill="#2d3a48"/>
  <rect x="298" y="134" width="22" height="38" rx="3" fill="#1b232d" stroke="#3a4b5c"/>${on?'<circle cx="309" cy="142" r="2" fill="#4de8b0"/>':''}
  ${has('lamp')?ART.lamp:''}${has('chair')?ART.chair:ART.stool}${char(me)}</svg>`;
}

/* ---------- связь ---------- */
const send=m=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(m))};
function connect(){
  const p=new URLSearchParams({initData:(tg&&tg.initData)||'',name:user.first_name||'Dev',id:user.id||'1'});
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?'+p);
  ws.onclose=()=>{stopLocal();setTimeout(connect,2000)};
  ws.onmessage=e=>handle(JSON.parse(e.data));
}
function stopLocal(){S.on=false;clearInterval(S.timer)}
function handle(m){
  if(m.t==='init'){
    CAT=m.cat;ADMIN=m.admin;ME=m.me;
    CAT.parts.forEach(p=>PT[p.id]=p);CAT.furn.forEach(p=>FU[p.id]=p);CAT.clothes.forEach(p=>CL[p.id]=p);CAT.games.forEach(g=>GM[g.id]=g);
    m.games.forEach(g=>ON[g.id]=g.online);apps();renderAll();
  }else if(m.t==='me'){ME=m.me;renderAll()}
  else if(m.t==='games'){m.games.forEach(g=>{PREV[g.id]=ON[g.id];ON[g.id]=g.online});if(cur&&cur.k==='twitch')winRender();else if(cur&&cur.k==='game'&&$('gon'))$('gon').textContent=num(ON[cur.id])}
  else if(m.t==='stream'){
    clearInterval(S.timer);S.on=m.on;
    if(m.on){S.g=m.game;S.earned=0;S.viewers=0;S.chat=[];S.timer=setInterval(()=>send({t:'stream_tick'}),5000);setTimeout(()=>send({t:'stream_tick'}),1200)}
    winRender();
  }else if(m.t==='tick')onTick(m);
  else if(m.t==='err'){toast(m.msg);buzz('error')}
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}

/* ---------- экраны ---------- */
const cha=()=>Math.min(15,Object.values(ME.wear).reduce((a,i)=>a+((CL[i]||{}).bonus||0),0));
function renderAll(){
  $('mny').textContent=fmt(ME.money);$('scene').innerHTML=scene(ME);
  $('chips').innerHTML=`<span class="chip">Красота комнаты: <b>${ME.decor}/100</b></span><span class="chip">Мощность ПК: <b>${ME.miss.length?'не собран':ME.score}</b></span><span class="chip">Подписчики: <b>${num(ME.fol)}</b></span><span class="chip">Образ: <b>+${cha()}%</b></span>`;
  shop();prof();if(cur&&!(cur.k==='game'&&S.on))winRender();
}
const row=(n,s,b)=>`<div class="row"><span>${esc(n)}<small>${esc(s)}</small></span>${b}</div>`;
function shop(){
  const tabs=[['parts','ПК'],['furn','Мебель'],['clothes','Одежда']].concat(ADMIN?[['skins','Скины']]:[]);
  $('shopsub').innerHTML=tabs.map(([k,n])=>`<button data-tab="${k}" class="${k===shopTab?'on':''}">${n}</button>`).join('');
  const buy=(k,x)=>ME[k].includes(x.id)?'<button class="mini" disabled>Есть</button>':`<button class="mini buy" data-buy="${k}:${x.id}" ${ME.money<x.price?'disabled':''}>${fmt(x.price)}</button>`;
  let h='';
  if(shopTab==='parts'){
    const bb={};ME.parts.forEach(i=>{const p=PT[i];if(!bb[p.slot]||p.power>PT[bb[p.slot]].power)bb[p.slot]=i});
    for(const sl of ['cpu','gpu','ram','cam','mic'])
      h+=`<h3>${SLN[sl]}</h3>`+CAT.parts.filter(p=>p.slot===sl).map(p=>row(p.name,(sl==='cam'||sl==='mic'?'качество ':'мощность ')+p.power+(bb[sl]===p.id?' · установлено':''),buy('parts',p))).join('');
  }else if(shopTab==='furn')h=CAT.furn.map(f=>row(f.name,'+'+f.pts+' к красоте комнаты',buy('furn',f))).join('');
  else if(shopTab==='clothes')h=CAT.clothes.map(c=>{
    const worn=ME.wear[c.slot]===c.id,own=ME.clothes.includes(c.id);
    return row(c.name,SLC[c.slot]+' · +'+c.bonus+'% к донатам',own?(worn?`<button class="mini" data-unwear="${c.slot}">Снять</button>`:`<button class="mini" data-wear="${c.id}">Надеть</button>`):buy('clothes',c))}).join('');
  else h='<p class="hint">Скины только для админа</p>'+CAT.skins.map(s=>row(s.name,'скин',ME.skin===s.id?'<button class="mini" data-skin="">Снять</button>':`<button class="mini" data-skin="${s.id}">Надеть</button>`)).join('');
  $('shoplist').innerHTML=h;
}
$('shopsub').onclick=e=>{const b=e.target.closest('button');if(b){shopTab=b.dataset.tab;shop()}};
$('shoplist').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.buy){const[k,i]=b.dataset.buy.split(':');send({t:'buy',kind:k,id:i});buzz('success')}
  else if(b.dataset.wear)send({t:'wear',id:b.dataset.wear});
  else if(b.dataset.unwear)send({t:'wear',slot:b.dataset.unwear,id:null});
  else if(b.dataset.skin!==undefined)send({t:'skin',id:b.dataset.skin||null});
};
function prof(){
  $('stats').innerHTML=[['Заработано на донатах',fmt(ME.earned)],['Подписчики',num(ME.fol)],['Красота комнаты',ME.decor+'/100'],['Мощность ПК',ME.miss.length?'не собран':ME.score],['Бонус образа','+'+cha()+'%']].map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
  $('adm').innerHTML=ADMIN?'<div class="card"><b>Команды админа (в чате с ботом)</b><br><small style="color:var(--dim)">/give ID сумма · /reset ID · /online игра число · /stats · /players · /broadcast текст</small></div>':'';
}

/* ---------- компьютер ---------- */
const APPCOL={twitch:'#7a4df0',tg:'#2aa3e8',chat:'#e67e22',dota2:'#c0392b',valorant:'#e74c5e',mc:'#4caf50',cs2:'#d9a23b',gta:'#27ae60',cyber:'#c9b200'};
function apps(){
  const list=[{id:'twitch',n:'Twitch'},{id:'tg',n:'Telegram'}].concat(CAT.games.map(g=>({id:g.id,n:g.name})));
  $('apps').innerHTML=list.map(a=>`<button class="app" data-app="${a.id}"><i style="background:${APPCOL[a.id]||'#445'}">${a.id==='tg'?'<svg viewBox="0 0 24 24" width="28" fill="#fff"><path d="M2 11l20-8-8 19-3-8z"/></svg>':esc(a.n[0])}</i>${esc(a.n)}</button>`).join('');
}
$('apps').onclick=e=>{const b=e.target.closest('.app');if(!b)return;const id=b.dataset.app;cur=id==='twitch'?{k:'twitch'}:id==='tg'?{k:'tg'}:{k:'game',id};winRender()};
$('wx').onclick=()=>{cur=null;winRender()};
$('sit').onclick=()=>{$('pc').classList.add('on');cur=null;winRender()};
$('pcx').onclick=()=>{$('pc').classList.remove('on');cur=null;if(S.on)send({t:'stream_stop'})};
function winRender(){
  const w=$('win');if(!cur||!ME){w.hidden=true;return}
  w.hidden=false;
  if(cur.k==='twitch'){
    $('wtt').textContent='Twitch · популярные игры сейчас';
    $('wb').innerHTML=CAT.games.slice().sort((a,b)=>ON[b.id]-ON[a.id]).map(g=>{const d=ON[g.id]-(PREV[g.id]||ON[g.id]);
      return row(g.name,num(ON[g.id])+' зрителей'+(d>0?' ▲':d<0?' ▼':'')+' · нужно ПК '+g.req,`<button class="mini" data-open="${g.id}">Открыть</button>`)}).join('');
    $('wb').onclick=e=>{const b=e.target.closest('[data-open]');if(b){cur={k:'game',id:b.dataset.open};winRender()}};
  }else if(cur.k==='tg'){
    $('wtt').textContent='Telegram · донаты и сообщения';
    $('wb').onclick=null;
    $('wb').innerHTML=ME.log.length?ME.log.slice().reverse().map(l=>`<div class="row"><span><b style="color:var(--gold)">${esc(l.n)}</b> · ${fmt(l.a)}<small>${esc(l.m)} (${esc(l.g)})</small></span></div>`).join(''):'<p class="hint">Пока нет сообщений. Проведи первый стрим.</p>';
  }else{
    const G=GM[cur.id],st=S.on&&S.g===cur.id,perf=Math.round(Math.max(.15,Math.min(1,ME.score/G.req))**1.5*100);
    $('wtt').textContent=G.name;
    $('wb').onclick=null;
    $('wb').innerHTML=`<div id="al"></div><div class="screen"><span class="gname">${esc(G.name)}</span><span class="fps ${perf<60?'bad':''}">${perf<60?'ЛАГИ':'60 FPS'} · ${perf}%</span><i class="blk" style="top:60px;width:80px"></i><i class="blk" style="top:90px;width:140px;animation-delay:-1s"></i><i class="blk" style="top:120px;width:60px;animation-delay:-2s"></i><div class="cam"><svg viewBox="196 92 108 108">${char(ME)}</svg></div></div>
    <div class="chips"><span class="chip">Онлайн игры: <b id="gon">${num(ON[G.id]||0)}</b></span><span class="chip">Нужно ПК: <b>${G.req}</b> (у вас ${ME.miss.length?'—':ME.score})</span>${st?`<span class="chip"><span class="live">LIVE</span>зрителей: <b id="sv">${S.viewers}</b></span><span class="chip">За стрим: <b id="se">${fmt(S.earned)}</b></span>`:''}</div>
    ${st?'<div id="chat">'+S.chat.map(chatLine).join('')+'</div>':''}
    <button class="big" id="sbtn" style="margin-top:12px;${st?'background:var(--red);color:#fff':''}">${st?'Закончить стрим':'Начать стрим'}</button>`;
    $('sbtn').onclick=()=>send(st?{t:'stream_stop'}:{t:'stream_start',game:G.id});
  }
}
const chatLine=e=>`<div><b>${esc(e.n)}</b> задонатил ${fmt(e.a)}: ${esc(e.m)}</div>`;
function onTick(m){
  S.viewers=m.viewers;ME.money=m.money;ME.fol=m.fol;ME.earned=m.earned;$('mny').textContent=fmt(ME.money);
  m.evs.forEach(ev=>{S.earned+=ev.a;S.chat.push(ev);ME.log.push(ev);alertEv(ev)});
  if(S.chat.length>40)S.chat.shift();
  if($('gon'))$('gon').textContent=num(m.online);if($('sv'))$('sv').textContent=S.viewers;if($('se'))$('se').textContent=fmt(S.earned);
  const c=$('chat');if(c&&m.evs.length){c.insertAdjacentHTML('beforeend',m.evs.map(chatLine).join(''));c.scrollTop=1e9}
  if(cur&&cur.k==='tg')winRender();
}
function alertEv(ev){
  buzz('success');const a=$('al');if(!a)return;
  a.innerHTML=`<div class="alert">${esc(ev.n)} · ${fmt(ev.a)}<br><small>${esc(ev.m)}</small></div>`;setTimeout(()=>{if($('al')===a)a.innerHTML=''},2800);
}

/* ---------- навигация ---------- */
const NB=[...document.querySelectorAll('nav button')],IND=document.querySelector('nav .ind');
NB.forEach(b=>b.onclick=()=>{
  NB.forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
  IND.style.transform='translateX('+NB.indexOf(b)*100+'%)';
});
connect();
</script>
</body>
</html>
